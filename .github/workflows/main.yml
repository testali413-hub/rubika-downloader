name: Rubika Uploader

on:
  workflow_dispatch:
    inputs:
      download_type:
        description: 'نوع دانلود (url, file, cookies)'
        required: true
      download_source:
        description: 'لینک، file_id یا cookies'
        required: true
      chat_id:
        description: 'شناسه عددی چت تلگرام'
        required: true
      cookies_base64:
        description: 'کوکی‌های base64 (اختیاری)'
        required: false
        default: ''

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js (for yt-dlp JS runtime)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          pip install yt-dlp requests rubpy

      - name: Download and Upload to Rubika
        env:
          TYPE: ${{ github.event.inputs.download_type }}
          SOURCE: ${{ github.event.inputs.download_source }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUBIKA_AUTH: ${{ secrets.RUBIKA_AUTH }}
          RUBIKA_KEY_RAW: ${{ secrets.RUBIKA_KEY_RAW }}
          COOKIES_BASE64: ${{ github.event.inputs.cookies_base64 }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          #!/bin/bash

          send_msg() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" -d "text=$1" > /dev/null
          }

          # مدیریت کوکی
          COOKIES_ARG=""
          COOKIES_FILE="cookies.txt"

          if [ "$TYPE" = "cookies" ]; then
            if [ -n "$COOKIES_BASE64" ]; then
              echo "$COOKIES_BASE64" | base64 -d > $COOKIES_FILE
              send_msg "🍪 کوکی‌ها ذخیره شدند."
            else
              send_msg "❌ فایل کوکی خالی است."
            fi
            exit 0
          fi

          if [ -n "$COOKIES_BASE64" ]; then
            echo "$COOKIES_BASE64" | base64 -d > $COOKIES_FILE
            COOKIES_ARG="--cookies $COOKIES_FILE"
          elif [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > $COOKIES_FILE
            COOKIES_ARG="--cookies $COOKIES_FILE"
          fi

          send_msg "⏳ شروع دانلود..."

          # دانلود
          DOWNLOAD_SUCCESS=false
          if [ "$TYPE" = "url" ]; then
            if yt-dlp $COOKIES_ARG \
                --extractor-args "youtube:player_client=ios" \
                --js-runtimes node \
                -o "downloaded_file.%(ext)s" \
                --merge-output-format mkv \
                --no-part "$SOURCE"; then
              FILENAME=$(ls downloaded_file.*)
              DOWNLOAD_SUCCESS=true
            else
              FILENAME=$(basename "$SOURCE")
              curl -L -o "$FILENAME" "$SOURCE" && DOWNLOAD_SUCCESS=true
            fi
          elif [ "$TYPE" = "file" ]; then
            send_msg "📥 دریافت فایل تلگرام..."
            FILE_INFO=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${SOURCE}")
            FILE_PATH=$(echo "$FILE_INFO" | jq -r '.result.file_path')
            if [ "$FILE_PATH" = "null" ] || [ -z "$FILE_PATH" ]; then
              send_msg "❌ خطا در دریافت اطلاعات فایل"
              exit 1
            fi
            FILENAME=$(basename "$FILE_PATH")
            curl -L -o "$FILENAME" "https://api.telegram.org/file/bot${BOT_TOKEN}/${FILE_PATH}" && DOWNLOAD_SUCCESS=true
          fi

          if [ "$DOWNLOAD_SUCCESS" != true ]; then
            send_msg "❌ دانلود شکست خورد"
            exit 1
          fi

          send_msg "📤 آپلود روی روبیکا..."

          # آپلود (با الگوریتم ترمیم خودکار کلید)
          python - <<EOF
          import asyncio, os, sys, textwrap, traceback
          from rubpy import Client

          def repair_key(raw):
              # حذف هدر و فوتر و هر چیز اضافی
              key = raw.replace('-----BEGIN RSA PRIVATE KEY-----', '')
              key = key.replace('-----END RSA PRIVATE KEY-----', '')
              key = key.replace('-----BEGIN PRIVATE KEY-----', '')
              key = key.replace('-----END PRIVATE KEY-----', '')
              key = key.replace('\\n', '').replace('\n', '').replace(' ', '')
              
              if len(key) < 100:
                  sys.exit(1)
                  
              # قالب‌بندی مجدد به خطوط ۶۴ کاراکتری
              formatted = '\n'.join(textwrap.wrap(key, width=64))
              return f"-----BEGIN RSA PRIVATE KEY-----\n{formatted}\n-----END RSA PRIVATE KEY-----"

          auth = os.environ.get('RUBIKA_AUTH')
          raw_key = os.environ.get('RUBIKA_KEY_RAW')
          
          private_key = repair_key(raw_key)

          async def main():
              try:
                  client = Client(name='rubika_session', auth=auth, private_key=private_key)
                  await client.start()
                  await client.send_file('me', '${FILENAME}', caption='✅ فایل آپلود شد')
                  print('UPLOAD_SUCCESS')
                  await client.disconnect()
                  return True
              except Exception as e:
                  print(f"ERROR: {e}")
                  traceback.print_exc()
                  return False

          if not asyncio.run(main()):
              sys.exit(1)
          EOF

          if [ $? -eq 0 ]; then
            send_msg "✅ فایل در سیو مسیج روبیکا ذخیره شد"
          else
            send_msg "❌ آپلود روی روبیکا شکست خورد"
          fi

          rm -f "$FILENAME" "$COOKIES_FILE"
